<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Playlist</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <link rel="stylesheet" href="../main.css" />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <main class="music-app">
            <!-- Artists -->
            <section class="section">
                <h1>Your Artists</h1>

                <div class="cards artists">
                    <article class="card artist-card" style="--bg-image: url('../images/c418.jpg');">
                        <img src="../images/c418.jpg" alt="c418" />
                        <div class="card-overlay"></div>
                        <div class="card-title">
                            <strong>c418</strong>
                        </div>
                    </article>

                    <!-- Добавлен style с переменной -->
                    <article class="card artist-card" style="--bg-image: url('../images/coldplay.jpg');">
                        <img src="../images/coldplay.jpg" alt="Coldplay" />
                        <div class="card-overlay"></div>
                        <div class="card-title">
                            <strong>Coldplay</strong>
                        </div>
                    </article>
                </div>
            </section>

            <!-- Your Vibe -->
            <section class="vibe">
                <span>Your Vibe</span>

                <button class="play-button"><i class="bi bi-play-fill"></i></button>
            </section>

            <!-- Playlists -->
            <section class="section playlists-section">
                <h1>Your Playlists</h1>

                <div class="cards playlists">
                    <article class="card playlist-card" style="--bg-image: url('../images/fifa_22.jpg');">
                        <img
                            src="../images/fifa_22.jpg"
                            alt="FIFA 22 Soundtrack"
                        />

                        <div class="card-overlay"></div>

                        <div class="card-title">
                            <strong>FIFA 22 Sou...</strong>
                        </div>
                    </article>

                    <article class="card playlist-card" style="--bg-image: url('../images/volume_alpha.jpg');">
                        <img src="../images/volume_alpha.jpg" alt="Minecraft" />

                        <div class="card-overlay"></div>

                        <div class="card-title">
                            <strong>Minecraft -...</strong>
                        </div>
                    </article>
                </div>
            </section>

            <section class="controls-section">
                <!-- Player controls -->
                <div class="controls">
                    <button class="control-button shuffle">
                        <i class="bi bi-shuffle"></i>
                    </button>

                    <button class="control-button favorite">
                        <i class="bi bi-heart-fill"></i>
                    </button>
                </div>

                <!-- Bottom player -->
                <div class="player">
                    <img
                        class="player-background"
                        src="../images/landline.jpg"
                        alt=""
                    />

                    <div class="player-overlay"></div>

                    <div class="track-info">
                        <strong>Landline</strong>
                        <span>binki</span>
                    </div>

                    <div class="player-controls">
                        <button><i class="bi bi-skip-start-fill"></i></button>

                        <button><i class="bi bi-skip-end-fill"></i></button>

                        <button class="main-play">
                            <i class="bi bi-play-fill"></i>
                        </button>
                    </div>
                </div>
            </section>
        </main>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
